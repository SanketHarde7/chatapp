services:
  postgres:
    image: postgres:16
    container_name: chatapp-postgres
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp_dev_password
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chatapp-redis
    ports:
      - "6379:6379"    


  nginx:
    image: nginx:1.27-alpine
    container_name: chatapp-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  app:
    build: .
    env_file: .env
    environment:
      PORT: 3000
      DB_HOST: chatapp-postgres
      DB_PORT: 5432
      REDIS_URL: redis://chatapp-redis:6379
    depends_on:
      - postgres
      - redis
volumes:
  pgdata:
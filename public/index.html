<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App - System Design Demo</title>
  <style>
    /* =========================================================
       CSS: Modern, Clean, Responsive Chat UI (Single-file)
       ========================================================= */
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --msg-sent: #2563eb;
      --msg-received: #334155;
      --status-connected: #22c55e;
      --status-reconnecting: #eab308;
      --status-disconnected: #ef4444;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Error Banner */
    #error-banner {
      display: none;
      background-color: #7f1d1d;
      color: #fecaca;
      border-bottom: 1px solid #dc2626;
      padding: 10px 16px;
      font-size: 14px;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }
    #error-banner.show {
      display: flex;
    }
    #error-banner button {
      background: none;
      border: none;
      color: #fecaca;
      font-size: 18px;
      cursor: pointer;
    }

    /* Screens */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
    }
    .screen.active {
      display: flex;
    }

    /* ---------------- Start Screen ---------------- */
    #start-screen {
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .auth-card h2 {
      margin-bottom: 8px;
      font-size: 24px;
      font-weight: 600;
    }
    .auth-card p {
      color: var(--text-muted);
      margin-bottom: 24px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--accent);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 16px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: var(--accent-hover);
    }
    .divider {
      text-align: center;
      position: relative;
      margin: 24px 0;
    }
    .divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border-color);
    }
    .divider span {
      position: relative;
      background: var(--bg-secondary);
      padding: 0 12px;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
    }
    .user-list {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .user-item-btn {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .user-item-btn:hover {
      background-color: var(--bg-tertiary);
      border-color: var(--accent);
    }

    /* ---------------- Chat Screen ---------------- */
    #chat-screen {
      flex-direction: row;
      height: 100vh;
    }

    /* Sidebar: Contacts */
    .sidebar {
      width: 320px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-profile {
      display: flex;
      flex-direction: column;
    }
    .user-profile .me-name {
      font-weight: 600;
      font-size: 15px;
    }
    .user-profile .me-id {
      font-size: 11px;
      color: var(--text-muted);
    }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-logout:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }
    .contacts-title {
      padding: 12px 16px 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .contacts-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }
    .contact-item {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }
    .contact-item:hover {
      background-color: rgba(255, 255, 255, 0.04);
    }
    .contact-item.active {
      background-color: var(--bg-tertiary);
      border-left: 3px solid var(--accent);
    }
    .avatar-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      color: #fff;
    }
    .contact-info {
      flex: 1;
      overflow: hidden;
    }
    .contact-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
    }
    .chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-secondary);
    }
    .chat-title {
      font-size: 16px;
      font-weight: 600;
    }

    /* Connection Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 9999px;
      background-color: rgba(0, 0, 0, 0.3);
      font-weight: 500;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-connected .status-dot { background-color: var(--status-connected); }
    .status-connected { color: var(--status-connected); }
    .status-reconnecting .status-dot { background-color: var(--status-reconnecting); }
    .status-reconnecting { color: var(--status-reconnecting); }
    .status-disconnected .status-dot { background-color: var(--status-disconnected); }
    .status-disconnected { color: var(--status-disconnected); }

    /* Messages Window */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
    .load-older-btn {
      align-self: center;
      background-color: var(--bg-tertiary);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.2s, color 0.2s;
    }
    .load-older-btn:hover {
      background-color: var(--accent);
      color: #fff;
    }

    /* Message Bubbles */
    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 65%;
    }
    .msg-wrapper.sent {
      align-self: flex-end;
      align-items: flex-end;
    }
    .msg-wrapper.received {
      align-self: flex-start;
      align-items: flex-start;
    }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg-wrapper.sent .msg-bubble {
      background-color: var(--msg-sent);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .msg-wrapper.received .msg-bubble {
      background-color: var(--msg-received);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }
    .msg-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }
    .msg-status-tick {
      font-weight: bold;
      font-size: 12px;
      color: #93c5fd;
    }

    /* Input Bar */
    .chat-input-bar {
      padding: 14px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      background-color: var(--bg-secondary);
    }
    .chat-input-bar input {
      flex: 1;
      padding: 10px 16px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }
    .chat-input-bar input:focus {
      border-color: var(--accent);
    }
    .btn-send {
      width: auto;
      padding: 0 20px;
    }
  </style>
</head>
<body>

  <!-- Persistent Error Banner -->
  <div id="error-banner">
    <span id="error-text">Something went wrong</span>
    <button onclick="dismissError()">&times;</button>
  </div>

  <!-- 1. Start Screen -->
  <div id="start-screen" class="screen active">
    <div class="auth-card">
      <h2>Welcome to Chat</h2>
      <p>Dev login / user selection</p>
      
      <div class="form-group">
        <label for="username-input">Create New User</label>
        <input type="text" id="username-input" class="form-control" placeholder="Enter username..." />
      </div>
      <button class="btn" id="btn-create-user">Create user</button>

      <div class="divider">
        <span>OR CONTINUE AS</span>
      </div>

      <div class="user-list" id="existing-users-list">
        <!-- Dynamically populated from GET /users -->
        <div style="color: var(--text-muted); font-size: 13px; text-align: center;">Loading users...</div>
      </div>
    </div>
  </div>

  <!-- 2. Chat Screen -->
  <div id="chat-screen" class="screen">
    <!-- Sidebar: Contacts -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="user-profile">
          <span class="me-name" id="my-username">User</span>
          <span class="me-id" id="my-id">ID</span>
        </div>
        <button class="btn-logout" id="btn-logout">Switch</button>
      </div>

      <div class="contacts-title">Contacts</div>
      <ul class="contacts-list" id="contacts-list">
        <!-- Dynamically populated -->
      </ul>
    </aside>

    <!-- Main Chat Window -->
    <main class="chat-area">
      <header class="chat-header">
        <div class="chat-title" id="chat-title">Select a contact to start chatting</div>
        <div class="status-badge status-disconnected" id="conn-status">
          <span class="status-dot"></span>
          <span id="conn-status-text">Disconnected</span>
        </div>
      </header>

      <div class="messages-container" id="messages-container">
        <div class="empty-state" id="empty-state">No conversation selected</div>
      </div>

      <footer class="chat-input-bar">
        <input type="text" id="message-input" placeholder="Type a message..." disabled />
        <button class="btn btn-send" id="btn-send" disabled>Send</button>
      </footer>
    </main>
  </div>

  <script>
    /* =========================================================
       JavaScript: Pure Vanilla JS Chat Client Architecture
       ========================================================= */

    // --- State Management ---
    let currentUser = null;          // { id, username }
    let activeContact = null;        // { id, username }
    let currentConversationId = null;// UUID or null
    let historyNextCursor = null;    // ULID cursor for older pagination
    let ws = null;                   // WebSocket instance
    let reconnectAttempts = 0;       // Exponential backoff tracker
    let reconnectTimeout = null;

    // Track displayed message IDs to avoid duplicates
    // Key: message id (ULID or clientId for pending)
    const displayedMessages = new Set();

    // DOM Elements
    const startScreen = document.getElementById("start-screen");
    const chatScreen = document.getElementById("chat-screen");
    const usernameInput = document.getElementById("username-input");
    const btnCreateUser = document.getElementById("btn-create-user");
    const existingUsersList = document.getElementById("existing-users-list");
    const contactsList = document.getElementById("contacts-list");
    const chatTitle = document.getElementById("chat-title");
    const myUsernameEl = document.getElementById("my-username");
    const myIdEl = document.getElementById("my-id");
    const btnLogout = document.getElementById("btn-logout");
    const connStatusEl = document.getElementById("conn-status");
    const connStatusText = document.getElementById("conn-status-text");
    const messagesContainer = document.getElementById("messages-container");
    const messageInput = document.getElementById("message-input");
    const btnSend = document.getElementById("btn-send");
    const errorBanner = document.getElementById("error-banner");
    const errorText = document.getElementById("error-text");

    // =========================================================
    // 1. Error Banner Handling
    // =========================================================
    function showError(msg) {
      errorText.textContent = typeof msg === "string" ? msg : JSON.stringify(msg);
      errorBanner.classList.add("show");
    }

    function dismissError() {
      errorBanner.classList.remove("show");
    }

    // =========================================================
    // 2. Connection Status Updates
    // =========================================================
    function setConnectionStatus(status) {
      connStatusEl.className = "status-badge";
      if (status === "connected") {
        connStatusEl.classList.add("status-connected");
        connStatusText.textContent = "Connected";
      } else if (status === "reconnecting") {
        connStatusEl.classList.add("status-reconnecting");
        connStatusText.textContent = "Reconnecting...";
      } else {
        connStatusEl.classList.add("status-disconnected");
        connStatusText.textContent = "Disconnected";
      }
      updateComposer();
    }

    // =========================================================
    // 3. User Authentication & Selection (Dev Mode)
    // =========================================================
    async function loadExistingUsers() {
      try {
        const res = await fetch("/users");
        if (!res.ok) throw new Error("Failed to load users");
        const users = await res.json();
        
        existingUsersList.innerHTML = "";
        if (users.length === 0) {
          existingUsersList.innerHTML = '<div style="color: var(--text-muted); font-size: 13px; text-align: center;">No users found. Create one!</div>';
          return;
        }

        users.forEach(u => {
          const btn = document.createElement("button");
          btn.className = "user-item-btn";
          btn.innerHTML = `<span><strong>${escapeHtml(u.username)}</strong></span><span style="font-size:11px; color:var(--text-muted);">Continue &rarr;</span>`;
          btn.onclick = () => selectUser(u);
          existingUsersList.appendChild(btn);
        });
      } catch (err) {
        existingUsersList.innerHTML = '<div style="color: var(--text-muted); font-size: 13px; text-align: center;">Could not load users</div>';
      }
    }

    async function handleCreateUser() {
      const username = usernameInput.value.trim();
      if (!username) {
        showError("Please enter a username");
        return;
      }

      try {
        const res = await fetch("/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username })
        });

        if (res.status === 409) {
          showError("Username already taken, please choose another.");
          return;
        }
        if (!res.ok) {
          throw new Error("Failed to create user");
        }

        const newUser = await res.json();
        selectUser(newUser);
      } catch (err) {
        showError(err.message || "Failed to create user");
      }
    }

    function selectUser(user) {
      currentUser = user;
      localStorage.setItem("chat_user_id", user.id);
      localStorage.setItem("chat_user_name", user.username);

      startScreen.classList.remove("active");
      chatScreen.classList.add("active");

      myUsernameEl.textContent = user.username;
      myIdEl.textContent = user.id.slice(0, 8) + "...";

      // Load contacts and connect WebSocket
      loadContacts();
      connectWebSocket();
    }

    function handleLogout() {
      localStorage.removeItem("chat_user_id");
      localStorage.removeItem("chat_user_name");
      clearTimeout(reconnectTimeout);
      if (ws) {
        // ws = null PEHLE: purane socket ka onclose "stale" maana jaayega, reconnect nahi lagega
        const old = ws;
        ws = null;
        old.close(1000, "user logout");
      }
      currentUser = null;
      activeContact = null;
      currentConversationId = null;
      chatScreen.classList.remove("active");
      startScreen.classList.add("active");
      loadExistingUsers();
    }

    // =========================================================
    // 4. Contacts & Conversation Handling
    // =========================================================
    async function loadContacts() {
      try {
        const res = await fetch("/users");
        if (!res.ok) throw new Error("Failed to fetch contacts");
        const users = await res.json();

        contactsList.innerHTML = "";
        const otherUsers = users.filter(u => u.id !== currentUser.id);

        if (otherUsers.length === 0) {
          contactsList.innerHTML = '<li style="padding: 16px; color: var(--text-muted); font-size: 13px; text-align: center;">No other users found</li>';
          return;
        }

        otherUsers.forEach(u => {
          const li = document.createElement("li");
          li.className = "contact-item";
          li.id = `contact-${u.id}`;
          li.innerHTML = `
            <div class="avatar-circle">${escapeHtml(u.username.charAt(0).toUpperCase())}</div>
            <div class="contact-info">
              <div class="contact-name">${escapeHtml(u.username)}</div>
            </div>
          `;
          li.onclick = () => openContact(u);
          contactsList.appendChild(li);
        });
      } catch (err) {
        showError("Could not load contacts list");
      }
    }

    async function openContact(contact) {
      activeContact = contact;
      chatTitle.textContent = contact.username;
      updateComposer();
      messageInput.focus();

      // Highlight active in sidebar
      document.querySelectorAll(".contact-item").forEach(el => el.classList.remove("active"));
      const activeEl = document.getElementById(`contact-${contact.id}`);
      if (activeEl) activeEl.classList.add("active");

      // Reset messages container
      messagesContainer.innerHTML = '<div class="empty-state">Loading conversation...</div>';
      displayedMessages.clear();
      historyNextCursor = null;

      // 1. Lookup conversationId
      try {
        const lookupRes = await fetch(`/conversations/lookup?userId=${encodeURIComponent(currentUser.id)}&with=${encodeURIComponent(contact.id)}`);
        if (lookupRes.ok) {
          const data = await lookupRes.json();
          currentConversationId = data.conversationId;
        } else {
          currentConversationId = null;
        }
      } catch (err) {
        currentConversationId = null;
      }

      // 2. Fetch history if conversation exists
      if (currentConversationId) {
        await loadHistory(currentConversationId);
      } else {
        messagesContainer.innerHTML = '<div class="empty-state">No messages yet. Send a message to start chatting!</div>';
      }
    }

    async function loadHistory(conversationId, beforeCursor = null) {
      try {
        let url = `/conversations/${conversationId}/messages?userId=${encodeURIComponent(currentUser.id)}&limit=30`;
        if (beforeCursor) {
          url += `&before=${encodeURIComponent(beforeCursor)}`;
        }

        const res = await fetch(url);
        if (!res.ok) throw new Error("Failed to load message history");
        const data = await res.json();
        // Tab/contact badal chuke ho toh purana jawab ignore karo
        if (conversationId !== currentConversationId) return;
        const { messages, nextCursor } = data;

        historyNextCursor = nextCursor;

        // If it was the first batch, clear loading indicator
        if (!beforeCursor) {
          messagesContainer.innerHTML = "";
          if (messages.length === 0) {
            messagesContainer.innerHTML = '<div class="empty-state">No messages yet</div>';
            return;
          }
        }

        // Response is newest-first, reverse to display chronologically (oldest -> newest)
        const chronological = [...messages].reverse();

        // Render "Load older" button at the top if more exist
        renderLoadOlderButton();

        // Store scroll position to maintain it when prepending older messages
        const prevScrollHeight = messagesContainer.scrollHeight;

        // Pehle sab bubbles ek fragment mein sahi (purana -> naya) kram mein banao,
        // phir ek hi baar mein jod do. Ek-ek karke insert karne se kram ulta ho jaata tha.
        const fragment = document.createDocumentFragment();
        chronological.forEach(m => {
          if (!displayedMessages.has(m.id)) {
            displayedMessages.add(m.id);
            const isMe = m.sender_id === currentUser.id;
            fragment.appendChild(createMessageElement({
              id: m.id,
              text: m.body,
              isMe: isMe,
              createdAt: m.created_at,
              status: isMe ? (m.delivered_at ? "✓✓" : "✓") : null
            }));
          }
        });

        if (beforeCursor) {
          const loadBtn = document.getElementById("btn-load-older");
          if (loadBtn) {
            loadBtn.after(fragment);
          } else {
            messagesContainer.prepend(fragment);
          }
        } else {
          messagesContainer.appendChild(fragment);
        }

        if (beforeCursor) {
          // Keep scroll position stable when loading older messages
          messagesContainer.scrollTop = messagesContainer.scrollHeight - prevScrollHeight;
        } else {
          scrollToBottom();
        }
      } catch (err) {
        showError("Failed to fetch messages");
      }
    }

    function renderLoadOlderButton() {
      let loadBtn = document.getElementById("btn-load-older");
      if (historyNextCursor) {
        if (!loadBtn) {
          loadBtn = document.createElement("button");
          loadBtn.id = "btn-load-older";
          loadBtn.className = "load-older-btn";
          loadBtn.textContent = "Load older messages";
          loadBtn.onclick = () => {
            if (currentConversationId && historyNextCursor) {
              loadHistory(currentConversationId, historyNextCursor);
            }
          };
          messagesContainer.prepend(loadBtn);
        }
      } else if (loadBtn) {
        loadBtn.remove();
      }
    }

    // =========================================================
    // 5. WebSocket Protocol & Sync Engine
    // =========================================================
    function connectWebSocket() {
      if (!currentUser) return;

      setConnectionStatus("reconnecting");

      // Construct WS URL with query parameter userId
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${window.location.host}?userId=${encodeURIComponent(currentUser.id)}`;

      const socket = new WebSocket(wsUrl);
      ws = socket;

      // Har handler mein check: kya yeh abhi wala socket hai? Purane (stale) socket ke events ignore.
      socket.onopen = () => {
        if (socket !== ws) return;
        console.log("WebSocket connected");
        setConnectionStatus("connected");
        reconnectAttempts = 0; // Reset backoff

        // Connect होते ही sync भेजो
        // Fetch lastId from localStorage (सिर्फ़ sync_done से update होता है)
        const lastId = localStorage.getItem(syncKey());
        sendWs({
          type: "sync",
          after: lastId || null
        });
      };

      socket.onmessage = (event) => {
        if (socket !== ws) return;
        try {
          const payload = JSON.parse(event.data);
          handleServerMessage(payload);
        } catch (err) {
          console.error("Malformed WS message:", event.data);
        }
      };

      socket.onerror = (err) => {
        console.error("WebSocket error:", err);
      };

      socket.onclose = (event) => {
        if (socket !== ws) return;
        console.log(`WebSocket closed (code: ${event.code}, reason: ${event.reason})`);
        setConnectionStatus("disconnected");

        // Code 1008: Policy violation (e.g., user not found or invalid userId)
        if (event.code === 1008) {
          showError("Session invalid (user not found on server). Please re-login.");
          handleLogout();
          return;
        }

        // Exponential backoff reconnect: 1s, 2s, 4s, 8s, up to max 15s
        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 15000);
        reconnectAttempts++;
        console.log(`Reconnecting in ${delay / 1000}s... (attempt ${reconnectAttempts})`);

        clearTimeout(reconnectTimeout);
        reconnectTimeout = setTimeout(() => {
          connectWebSocket();
        }, delay);
      };
    }

    // true = bhej diya, false = connection khula nahi tha.
    // Banner yahan nahi: delivered rasid chhoot jaaye toh reconnect par sync se dobara aa jaati hai.
    function sendWs(payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
        return true;
      }
      return false;
    }

    // Per-user key: ek hi browser mein user badlo toh doosre ka cursor use na ho
    function syncKey() {
      return "chat_last_sync_id_" + currentUser.id;
    }

    // Send/input tabhi chalu jab chat khuli ho AUR connection OPEN ho
    function updateComposer() {
      const canSend = !!activeContact && !!ws && ws.readyState === WebSocket.OPEN;
      messageInput.disabled = !canSend;
      btnSend.disabled = !canSend;
    }

    // Server-to-Client Message Handler
    function handleServerMessage(msg) {
      switch (msg.type) {
        // 1. Live Incoming Message
        case "message": {
          const { id, conversationId, from, text, createdAt } = msg;
          const isMe = from === currentUser.id;

          // Duplicate check: if already displayed, ignore
          if (displayedMessages.has(id)) {
            // Rasid sirf mujhe AANE wale messages ki; apne bheje hue ki nahi
            if (!isMe) sendWs({ type: "delivered", id: id });
            return;
          }
          displayedMessages.add(id);

          // Dikhao tabhi jab message isi khuli chat ka ho:
          // doosre ka message -> uska contact khula ho; mera apna -> conversationId match kare
          const belongsToOpenChat =
            activeContact &&
            (isMe ? conversationId === currentConversationId : from === activeContact.id);

          if (belongsToOpenChat) {
            // Remove empty state if present
            const emptyState = document.getElementById("empty-state");
            if (emptyState) emptyState.remove();

            const bubbleEl = createMessageElement({
              id: id,
              text: text,
              isMe: isMe,
              createdAt: createdAt,
              status: isMe ? "✓" : null
            });
            messagesContainer.appendChild(bubbleEl);
            scrollToBottom();
          }

          // Remember conversation ID if newly started
          if (activeContact && from === activeContact.id && !currentConversationId) {
            currentConversationId = conversationId;
          }

          // नया message आए तो server को delivered रसीद भेजो (सिर्फ़ दूसरे के भेजे हुए की)
          if (!isMe) sendWs({ type: "delivered", id: id });
          break;
        }

        // 2. Ack (Message saved on server)
        case "ack": {
          const { clientId, id, conversationId } = msg;
          if (conversationId && !currentConversationId) {
            currentConversationId = conversationId;
          }

          // clientId से पहचानकर उसे एक टिक (✓) करो
          if (clientId) {
            const pendingEl = document.querySelector(`[data-client-id="${clientId}"]`);
            if (pendingEl) {
              pendingEl.dataset.messageId = id;
              const tickEl = pendingEl.querySelector(".msg-status-tick");
              if (tickEl) tickEl.textContent = "✓";
              displayedMessages.add(id);
            }
          }
          break;
        }

        // 3. Delivered ( सामने वाले को मिल गया )
        case "delivered": {
          const { id } = msg;
          // ID से ढूँढकर दो टिक (✓✓) करो
          const msgEl = document.querySelector(`[data-message-id="${id}"]`);
          if (msgEl) {
            const tickEl = msgEl.querySelector(".msg-status-tick");
            if (tickEl) tickEl.textContent = "✓✓";
          }
          break;
        }

        // 4. Sync Done Batch
        case "sync_done": {
          const { hasMore, lastId } = msg;
          
          // lastId को localStorage में रखो, और सिर्फ़ sync_done से बदलो
          if (lastId) {
            localStorage.setItem(syncKey(), lastId);
          }

          // अगर hasMore: true हो तो lastId के साथ फिर sync भेजो
          if (hasMore) {
            sendWs({
              type: "sync",
              after: lastId || null
            });
          }
          break;
        }

        // 5. Server Error
        case "error": {
          showError(`Server: ${msg.error}`);
          break;
        }

        default:
          console.warn("Unknown message type:", msg);
      }
    }

    // =========================================================
    // 6. Sending Messages & Optimistic UI
    // =========================================================
    function handleSendMessage() {
      const text = messageInput.value.trim();
      if (!text || !activeContact) return;

      // Connection khula nahi hai toh message bhejna hi mat; jhoothi "pending" bubble na bane
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        showError("Not connected. Wait for reconnect, then send again.");
        return;
      }

      // Unique client-side ID for optimistic matching
      const clientId = "c_" + Date.now() + "_" + Math.random().toString(36).substring(2, 9);

      // Remove empty state if present
      const emptyState = document.getElementById("empty-state");
      if (emptyState) emptyState.remove();

      // 1. Optimistic UI: तुरंत दिखाओ, घड़ी के निशान के साथ (pending: 🕒)
      const bubbleEl = createMessageElement({
        clientId: clientId,
        text: text,
        isMe: true,
        status: "🕒"
      });
      messagesContainer.appendChild(bubbleEl);
      scrollToBottom();

      // 2. Clear input
      messageInput.value = "";
      messageInput.focus();

      // 3. Send over WebSocket
      sendWs({
        to: activeContact.id,
        text: text,
        clientId: clientId
      });
    }

    // =========================================================
    // 7. UI Helpers
    // =========================================================
    function createMessageElement({ id = null, clientId = null, text, isMe, status = null, createdAt = null }) {
      const wrapper = document.createElement("div");
      wrapper.className = `msg-wrapper ${isMe ? "sent" : "received"}`;
      if (id) wrapper.dataset.messageId = id;
      if (clientId) wrapper.dataset.clientId = clientId;

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";
      bubble.textContent = text; // Secure text content against XSS

      const meta = document.createElement("div");
      meta.className = "msg-meta";

      // Asli samay (server ka created_at) dikhao; na ho toh abhi ka
      const time = new Date(createdAt ?? Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      meta.innerHTML = `<span>${time}</span>`;

      if (isMe && status) {
        const tick = document.createElement("span");
        tick.className = "msg-status-tick";
        tick.textContent = status;
        meta.appendChild(tick);
      }

      wrapper.appendChild(bubble);
      wrapper.appendChild(meta);
      return wrapper;
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[m]);
    }

    // =========================================================
    // 8. Event Listeners & Initialization
    // =========================================================
    btnCreateUser.addEventListener("click", handleCreateUser);
    usernameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleCreateUser();
    });

    btnSend.addEventListener("click", handleSendMessage);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSendMessage();
    });

    btnLogout.addEventListener("click", handleLogout);

    // Initial App Boot
    window.addEventListener("DOMContentLoaded", () => {
      const savedUserId = localStorage.getItem("chat_user_id");
      const savedUserName = localStorage.getItem("chat_user_name");

      if (savedUserId && savedUserName) {
        // Auto-login existing dev user
        selectUser({ id: savedUserId, username: savedUserName });
      } else {
        loadExistingUsers();
      }
    });
  </script>
</body>
